name: Release

# Uma tag v1.2.3 gera os instaladores (Windows, macOS Apple e Intel, Linux) e cria um release
# em RASCUNHO. Ele só fica visível quando alguém publica o rascunho no GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_target: ""
          - os: ubuntu-22.04
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: A tag tem que ser igual à versão do app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, mas tauri.conf.json diz $v"; exit 1; }

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # O SQLCipher compila o OpenSSL junto; no Windows ele precisa do NASM.
      - name: NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust_target }}

      - run: npm ci

      # Testes rodam aqui também: um release nunca sai de um código com teste falhando.
      - name: Testes
        if: runner.os == 'Linux'
        run: |
          npx vitest run
          cd src-tauri && cargo test --lib

      # Sem certificado pago: o macOS recebe a assinatura ad-hoc ("-") e o Windows sai sem assinatura.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lume __VERSION__"
          releaseBody: "As notas entram ao final do fluxo."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Fecha o release: somas SHA-256 (o instalador do Mac confere o .dmg contra elas) e as notas,
  # que começam com a tabela de qual arquivo baixar (quem chega costuma pegar o "Source code").
  finalize:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - name: SHA256SUMS.txt e notas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir out --skip-existing
          rm -f out/SHA256SUMS.txt
          (cd out && sha256sum * > ../SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          version="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/$version/g" .github/release-notes.md > notas.md
          flags=""
          # versão com hífen (0.2.0-beta.1) vira pré-lançamento
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Lume $version" --notes-file notas.md $flags
