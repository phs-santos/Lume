[package]
name = "lume"
version = "0.1.0"
description = "Lume — escrivaninha para escrever livros"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = { version = "2", features = ["portuguese"] }
rand = "0.8"
zeroize = "1.9.2"
base64 = "0.23.1"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
crypto_box = { version = "0.9", features = ["seal", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Argon2 e SQLCipher ficam lentíssimos sem otimização; otimiza dependências também em dev/test.
[profile.dev.package."*"]
opt-level = 3
